    // Component: Snake Game Implementation (Fully self-contained, perfect swipe & key inputs)
    function SnakeGame({ onGameOver, onExit, isSoundOn }) {
      const [score, setScore] = useState(0);
      const [gameState, setGameState] = useState('idle'); // idle, playing, gameover
      const canvasRef = useRef(null);
      const containerRef = useRef(null);

      const stateRef = useRef({
        snake: [{ x: 10, y: 10 }],
        direction: 'RIGHT',
        lastProcessedDirection: 'RIGHT',
        food: { x: 5, y: 5 },
        gridSize: 20,
        tileCount: 15,
        score: 0,
        speed: 120,
        gameState: 'idle'
      });

      const playSound = (type) => {
        if (!isSoundOn) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'eat') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1); // A5
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
          } else if (type === 'die') {
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          }
        } catch (e) {}
      };

      const spawnFood = () => {
        const tileCount = stateRef.current.tileCount;
        const snake = stateRef.current.snake;
        let newFood;
        let onSnake = true;

        while (onSnake) {
          newFood = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount),
          };
          onSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
        }
        stateRef.current.food = newFood;
      };

      const handleStart = () => {
        stateRef.current.snake = [
          { x: 5, y: 5 },
          { x: 4, y: 5 },
          { x: 3, y: 5 },
        ];
        stateRef.current.direction = 'RIGHT';
        stateRef.current.lastProcessedDirection = 'RIGHT';
        stateRef.current.score = 0;
        setScore(0);
        spawnFood();
        setGameState('playing');
        stateRef.current.gameState = 'playing';
      };

      const changeDirection = (newDir) => {
        const last = stateRef.current.lastProcessedDirection;
        if (newDir === 'UP' && last !== 'DOWN') stateRef.current.direction = 'UP';
        if (newDir === 'DOWN' && last !== 'UP') stateRef.current.direction = 'DOWN';
        if (newDir === 'LEFT' && last !== 'RIGHT') stateRef.current.direction = 'LEFT';
        if (newDir === 'RIGHT' && last !== 'LEFT') stateRef.current.direction = 'RIGHT';
      };

      // Key Events
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (stateRef.current.gameState !== 'playing') return;
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'w', 's', 'a', 'd'].includes(e.key)) {
            e.preventDefault();
          }
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDirection('UP');
          if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDirection('DOWN');
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDirection('LEFT');
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDirection('RIGHT');
        };
        window.addEventListener('keydown', handleKeyDown, { passive: false });
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Touch Events for Mobile
      const touchStartRef = useRef(null);
      useEffect(() => {
        const handleTouchStart = (e) => {
          if (stateRef.current.gameState !== 'playing') return;
          const touch = e.touches[0];
          touchStartRef.current = { x: touch.clientX, y: touch.clientY };
        };

        const handleTouchMove = (e) => {
          if (!touchStartRef.current || stateRef.current.gameState !== 'playing') return;
          const touch = e.touches[0];
          const diffX = touch.clientX - touchStartRef.current.x;
          const diffY = touch.clientY - touchStartRef.current.y;
          const threshold = 25;

          if (Math.abs(diffX) > Math.abs(diffY)) {
            if (Math.abs(diffX) > threshold) {
              if (e.cancelable) e.preventDefault();
              if (diffX > 0) changeDirection('RIGHT');
              else changeDirection('LEFT');
              touchStartRef.current = null;
            }
          } else {
            if (Math.abs(diffY) > threshold) {
              if (e.cancelable) e.preventDefault();
              if (diffY > 0) changeDirection('DOWN');
              else changeDirection('UP');
              touchStartRef.current = null;
            }
          }
        };

        const canvas = canvasRef.current;
        if (canvas) {
          canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
          canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        }
        return () => {
          if (canvas) {
            canvas.removeEventListener('touchstart', handleTouchStart);
            canvas.removeEventListener('touchmove', handleTouchMove);
          }
        };
      }, [gameState]);

      // Game Loop
      useEffect(() => {
        let intervalId;
        const gameTick = () => {
          if (stateRef.current.gameState !== 'playing') return;

          const snake = [...stateRef.current.snake];
          const direction = stateRef.current.direction;
          stateRef.current.lastProcessedDirection = direction;
          const food = stateRef.current.food;
          const tileCount = stateRef.current.tileCount;

          const head = { ...snake[0] };
          if (direction === 'UP') head.y -= 1;
          if (direction === 'DOWN') head.y += 1;
          if (direction === 'LEFT') head.x -= 1;
          if (direction === 'RIGHT') head.x += 1;

          if (
            head.x < 0 || head.x >= tileCount ||
            head.y < 0 || head.y >= tileCount ||
            snake.some(seg => seg.x === head.x && seg.y === head.y)
          ) {
            playSound('die');
            setGameState('gameover');
            stateRef.current.gameState = 'gameover';
            const coinsEarned = Math.floor(stateRef.current.score * 1.5);
            onGameOver(stateRef.current.score, coinsEarned);
            return;
          }

          snake.unshift(head);

          if (head.x === food.x && head.y === food.y) {
            playSound('eat');
            stateRef.current.score += 10;
            setScore(stateRef.current.score);
            spawnFood();
          } else {
            snake.pop();
          }

          stateRef.current.snake = snake;
          draw();
        };

        const draw = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const { snake, food, tileCount } = stateRef.current;
          const size = canvas.width / tileCount;

          ctx.fillStyle = '#0b0c10';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.strokeStyle = '#1f2833';
          ctx.lineWidth = 0.5;
          for (let i = 0; i <= tileCount; i++) {
            ctx.beginPath();
            ctx.moveTo(i * size, 0);
            ctx.lineTo(i * size, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * size);
            ctx.lineTo(canvas.width, i * size);
            ctx.stroke();
          }

          ctx.fillStyle = '#ff4d4d';
          ctx.shadowColor = '#ff4d4d';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size / 2 - 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          snake.forEach((segment, index) => {
            const isHead = index === 0;
            ctx.fillStyle = isHead ? '#4eff8a' : '#1f8a4f';
            ctx.shadowColor = isHead ? '#4eff8a' : 'transparent';
            ctx.shadowBlur = isHead ? 8 : 0;
            
            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(segment.x * size + 1, segment.y * size + 1, size - 2, size - 2, isHead ? 6 : 4);
            } else {
              ctx.rect(segment.x * size + 1, segment.y * size + 1, size - 2, size - 2);
            }
            ctx.fill();
            ctx.shadowBlur = 0;
          });
        };

        if (gameState === 'playing') {
          intervalId = setInterval(gameTick, stateRef.current.speed);
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
        };
      }, [gameState]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (canvas) {
          canvas.width = 300;
          canvas.height = 300;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Component: Knife Rain Game
    function KnifeHit({ onGameOver, onExit }) {
      const [score, setScore] = useState(0);
      const [knivesLeft, setKnivesLeft] = useState(7);
      const [gameState, setGameState] = useState('idle');
      const canvasRef = useRef(null);

      const stateRef = useRef({
        rotation: 0,
        rotationSpeed: 0.03,
        knives: [], // array of angles relative to log
        flyingKnife: null, // y coordinate
        knivesCount: 7,
        score: 0,
        gameState: 'idle'
      });

      const handleStart = () => {
        stateRef.current.rotation = 0;
        stateRef.current.rotationSpeed = 0.03;
        stateRef.current.knives = [];
        stateRef.current.flyingKnife = null;
        stateRef.current.score = 0;
        stateRef.current.knivesCount = 7;
        setScore(0);
        setKnivesLeft(7);
        setGameState('playing');
        stateRef.current.gameState = 'playing';
      };

      const throwKnife = () => {
        if (stateRef.current.gameState !== 'playing') return;
        if (stateRef.current.flyingKnife !== null) return; // already throwing
        stateRef.current.flyingKnife = 240; // start moving up
      };

      // Game Loop
      useEffect(() => {
        let frameId;
        const gameTick = () => {
          if (stateRef.current.gameState !== 'playing') return;

          // Rotate Log
          stateRef.current.rotation += stateRef.current.rotationSpeed;
          if (Math.random() < 0.015) {
            stateRef.current.rotationSpeed = (Math.random() > 0.5 ? 1 : -1) * (0.02 + Math.random() * 0.04);
          }

          // Flying Knife update
          if (stateRef.current.flyingKnife !== null) {
            stateRef.current.flyingKnife -= 15;
            if (stateRef.current.flyingKnife <= 85) {
              const hitY = stateRef.current.flyingKnife;
              stateRef.current.flyingKnife = null;

              // Calculate landing angle relative to current log rotation
              const relativeAngle = -stateRef.current.rotation + Math.PI / 2;
              const angleNorm = (relativeAngle + Math.PI * 10) % (Math.PI * 2);

              // Check hit of existing knives
              const overlap = stateRef.current.knives.some(angle => {
                const diff = Math.abs(angle - angleNorm);
                const limit = 0.22; // angle limits
                return diff < limit || (Math.PI * 2 - diff) < limit;
              });

              if (overlap) {
                // Game Over
                setGameState('gameover');
                stateRef.current.gameState = 'gameover';
                onGameOver(stateRef.current.score, Math.floor(stateRef.current.score * 1.2));
              } else {
                // Success hit
                stateRef.current.knives.push(angleNorm);
                stateRef.current.score += 10;
                setScore(stateRef.current.score);

                const nextCount = stateRef.current.knivesCount - 1;
                stateRef.current.knivesCount = nextCount;
                setKnivesLeft(nextCount);

                if (nextCount <= 0) {
                  // Stage Clear bonus
                  stateRef.current.score += 30;
                  setScore(stateRef.current.score);
                  stateRef.current.knives = [];
                  stateRef.current.knivesCount = 7;
                  setKnivesLeft(7);
                  stateRef.current.rotationSpeed *= 1.2;
                }
              }
            }
          }

          draw();
          frameId = requestAnimationFrame(gameTick);
        };

        const draw = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          ctx.fillStyle = '#0f0e15';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Draw central target log
          ctx.save();
          ctx.translate(150, 85);
          ctx.rotate(stateRef.current.rotation);
          
          ctx.fillStyle = '#8b5a2b';
          ctx.beginPath();
          ctx.arc(0, 0, 45, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#5c3a21';
          ctx.lineWidth = 4;
          ctx.stroke();

          // Log core design rings
          ctx.beginPath();
          ctx.arc(0, 0, 30, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.stroke();

          // Draw embedded knives
          stateRef.current.knives.forEach(angle => {
            ctx.save();
            ctx.rotate(angle);
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(-2, 38, 4, 30);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-3, 68, 6, 8);
            ctx.restore();
          });

          ctx.restore();

          // Draw flying knife
          if (stateRef.current.flyingKnife !== null) {
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(148, stateRef.current.flyingKnife, 4, 30);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(147, stateRef.current.flyingKnife + 30, 6, 8);
          } else if (stateRef.current.gameState === 'playing') {
            ctx.fillStyle = 'rgba(203, 213, 225, 0.4)';
            ctx.fillRect(148, 240, 4, 30);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.fillRect(147, 270, 6, 8);
          }
        };

        if (gameState === 'playing') {
          frameId = requestAnimationFrame(gameTick);
        }
        return () => cancelAnimationFrame(frameId);
      }, [gameState]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (canvas) {
          canvas.width = 300;
          canvas.height = 300;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.fillStyle = '#0f0e15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f59e0b';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Tap screen to throw Knives!', canvas.width / 2, canvas.height / 2);
          }
        }
      }, []);

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full h-full max-w-sm mx-auto select-none">
          <div className="flex justify-between w-full mb-3 px-2">
            <span className="text-gray-400 font-mono text-xs">SCORE: <span className="text-amber-400 font-bold">{score}</span></span>
            <span className="text-gray-400 font-mono text-xs">KNIVES: <span className="text-red-400 font-bold">{knivesLeft} Left</span></span>
          </div>

          <div onClick={throwKnife} className="relative aspect-square w-full rounded-2xl overflow-hidden border border-white/10 shadow-lg bg-[#0f0e15] cursor-pointer">
            <canvas ref={canvasRef} className="w-full h-full block" />

            {gameState === 'idle' && (
              <div className="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-4 z-10">
                <h3 className="text-xl font-bold text-white mb-2 font-display">KNIFE RAIN</h3>
                <p className="text-xs text-gray-400 text-center mb-6 max-w-[200px]">
                  Tap the target area to throw sharp knives! Do not hit your existing knives.
                </p>
                <button
                  onClick={(e) => { e.stopPropagation(); handleStart(); }}
                  className="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black rounded-xl shadow-lg cursor-pointer active:scale-95 transition-all"
                >
                  PLAY GAME
                </button>
              </div>
            )}

            {gameState === 'gameover' && (
              <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-4 z-10">
                <h3 className="text-2xl font-black text-red-500 mb-1 font-display">GAME OVER</h3>
                <span className="text-xs text-gray-400 mb-6">Score: {score} | Coins: +{Math.floor(score * 1.2)}</span>
                <button
                  onClick={(e) => { e.stopPropagation(); handleStart(); }}
                  className="px-5 py-2.5 bg-white text-black hover:bg-amber-500 hover:text-white text-xs font-bold rounded-xl transition-all cursor-pointer flex items-center gap-1 active:scale-95"
                >
                  RESTART
                </button>
              </div>
            )}
          </div>

          <div className="text-center mt-4">
            <p className="text-[10px] text-gray-500 font-mono">CLICK/TAP SCREEN TO LAUNCH KNIFE</p>
          </div>
        </div>
      );
    }

    // Component 3: Tower Stack (Timing & precision block stacker)
    function TowerStack({ onGameOver, onExit }) {
      const [score, setScore] = useState(0);
      const [gameState, setGameState] = useState('idle');
      const [blocks, setBlocks] = useState([{ x: 70, w: 160, color: '#6366f1' }]);
      const [x, setX] = useState(0);
      const [width, setWidth] = useState(160);
      const [dir, setDir] = useState(1);

      useEffect(() => {
        if (gameState !== 'playing') return;
        const interval = setInterval(() => {
          setX(prev => {
            let next = prev + dir * 6;
            if (next < 0 || next + width > 300) {
              setDir(d => -d);
              return Math.max(0, Math.min(next, 300 - width));
            }
            return next;
          });
        }, 30);
        return () => clearInterval(interval);
      }, [gameState, dir, width]);

      const handlePlace = () => {
        if (gameState !== 'playing') return;
        const last = blocks[blocks.length - 1];
        const left1 = x, right1 = x + width;
        const left2 = last.x, right2 = last.x + last.w;
        if (right1 <= left2 || left1 >= right2) {
          setGameState('gameover');
          onGameOver(score, Math.floor(score * 0.5));
          return;
        }
        const nextX = Math.max(left1, left2);
        const nextW = Math.min(right1, right2) - nextX;
        setWidth(nextW);
        const nextBlocks = [...blocks, { x: nextX, w: nextW, color: `hsl(${(blocks.length * 32) % 360}, 85%, 60%)` }];
        if (nextBlocks.length > 8) nextBlocks.shift();
        setBlocks(nextBlocks);
        setScore(s => s + 10);
        setX(0);
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-md mx-auto animate-fade-in" onClick={handlePlace}>
          <div className="flex justify-between w-full mb-3 text-xs font-mono text-gray-400">
            <span>SCORE: <span className="text-indigo-400 font-bold">{score}</span></span>
            <span>WIDTH: <span className="text-pink-400 font-bold">{Math.round(width)}px</span></span>
          </div>
          <div className="relative aspect-square w-full rounded-2xl overflow-hidden border border-white/10 shadow-lg bg-[#0c0a12] cursor-pointer">
            <div className="absolute inset-0 flex flex-col justify-end p-6 pb-12">
              {blocks.map((b, idx) => (
                <div key={idx} className="h-6 rounded shadow-md transition-all duration-300" style={{ width: b.w, marginLeft: b.x, backgroundColor: b.color, boxShadow: `0 0 15px ${b.color}` }} />
              ))}
              {gameState === 'playing' && (
                <div className="h-6 rounded shadow-md" style={{ width: width, marginLeft: x, backgroundColor: '#f43f5e', boxShadow: `0 0 15px #f43f5e` }} />
              )}
            </div>
            {gameState !== 'playing' && (
              <div className="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-4">
                <h3 className="text-xl font-black text-white font-display mb-2 uppercase tracking-wider">Tower Stack</h3>
                <p className="text-xs text-gray-400 text-center mb-6 max-w-[240px]">Align sliding blocks perfectly to stack a towering neon structure!</p>
                <div className="flex gap-2">
                  <button onClick={(e) => { e.stopPropagation(); setBlocks([{ x: 70, w: 160, color: '#6366f1' }]); setWidth(160); setScore(0); setGameState('playing'); }} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl active:scale-95 transition-all">START GAME</button>
                  <button onClick={(e) => { e.stopPropagation(); onExit(); }} className="px-5 py-2.5 bg-white/10 hover:bg-white/20 text-white text-xs font-bold rounded-xl active:scale-95 transition-all">EXIT</button>
                </div>
              </div>
            )}

    // Component 4: Cyber Minesweeper (Classic neon matrix clearing)
    function Minesweeper({ onGameOver, onExit }) {
      const [grid, setGrid] = useState([]);
      const [gameOver, setGameOver] = useState(false);
      const [won, setWon] = useState(false);
      const [score, setScore] = useState(0);

      const initGrid = () => {
        const size = 5;
        const mineCount = 4;
        let cells = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            cells.push({ r, c, isMine: false, revealed: false, count: 0 });
          }
        }
        let placed = 0;
        while (placed < mineCount) {
          let idx = Math.floor(Math.random() * cells.length);
          if (!cells[idx].isMine) {
            cells[idx].isMine = true;
            placed++;
          }
        }
        cells.forEach(cell => {
          if (cell.isMine) return;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = cell.r + dr, nc = cell.c + dc;
              if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                let neighbor = cells.find(x => x.r === nr && x.c === nc);
                if (neighbor && neighbor.isMine) count++;
              }
            }
          }
          cell.count = count;
        });
        setGrid(cells);
        setGameOver(false);
        setWon(false);
        setScore(0);
      };

      useEffect(() => { initGrid(); }, []);

      const reveal = (cell) => {
        if (gameOver || won || cell.revealed) return;
        const nextGrid = [...grid];
        const target = nextGrid.find(x => x.r === cell.r && x.c === cell.c);
        target.revealed = true;
        if (target.isMine) {
          nextGrid.forEach(x => { if (x.isMine) x.revealed = true; });
          setGrid(nextGrid);
          setGameOver(true);
          onGameOver(score, Math.floor(score * 0.4));
          return;
        }
        setScore(s => s + 10);
        const winCheck = nextGrid.filter(x => !x.isMine && !x.revealed).length === 0;
        if (winCheck) {
          setWon(true);
          onGameOver(score + 100, Math.floor((score + 100) * 0.6));
        }
        setGrid(nextGrid);
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-sm mx-auto">
          <div className="flex justify-between w-full mb-3 text-xs font-mono text-gray-400">
            <span>MATRIX STATUS: <span className={gameOver ? 'text-red-500 font-bold' : won ? 'text-green-500 font-bold' : 'text-blue-400 font-bold'}>{gameOver ? 'COMPROMISED' : won ? 'CLEARED' : 'SECURE'}</span></span>
            <span>SCORE: <span className="text-yellow-400 font-bold">{score}</span></span>
          </div>
          <div className="grid grid-cols-5 gap-2 p-3 bg-slate-900/80 rounded-2xl border border-white/10 w-full aspect-square">
            {grid.map((cell, idx) => (
              <button key={idx} onClick={() => reveal(cell)} className={`w-full aspect-square flex items-center justify-center rounded-xl text-sm font-black transition-all ${cell.revealed ? (cell.isMine ? 'bg-red-500 text-white border-red-400 shadow-lg shadow-red-500/30' : 'bg-slate-850 text-sky-400 border border-sky-500/20 shadow-inner') : 'bg-slate-800 hover:bg-slate-700 border border-white/5 active:scale-90 text-transparent'}`}>
                {cell.revealed ? (cell.isMine ? '💣' : cell.count || '') : ''}
              </button>
            ))}
          </div>
          <div className="flex gap-2 mt-4 w-full justify-center">
            <button onClick={initGrid} className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl">RESTART</button>
            <button onClick={onExit} className="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white text-xs font-bold rounded-xl">EXIT</button>
          </div>
        </div>
      );
    }

    // Component 5: Memory Matcher (Tech themed emoji matching)
    function MemoryMatch({ onGameOver, onExit }) {
      const emojis = ['💻', '🤖', '👾', '🚀', '🧠', '⚡', '🎮', '💡'];
      const [cards, setCards] = useState([]);
      const [flipped, setFlipped] = useState([]);
      const [matched, setMatched] = useState([]);
      const [score, setScore] = useState(0);
      const [time, setTime] = useState(45);

      const initCards = () => {
        const double = [...emojis, ...emojis];
        const shuffled = double.map((e, i) => ({ id: i, emoji: e })).sort(() => Math.random() - 0.5);
        setCards(shuffled);
        setFlipped([]);
        setMatched([]);
        setScore(0);
        setTime(45);
      };

      useEffect(() => {
        initCards();
      }, []);

      useEffect(() => {
        if (time <= 0) {
          onGameOver(score, Math.floor(score * 0.3));
          return;
        }
        if (matched.length === emojis.length) {
          onGameOver(score + time * 5, Math.floor((score + time * 5) * 0.5));
          return;
        }
        const timer = setTimeout(() => setTime(t => t - 1), 1000);
        return () => clearTimeout(timer);
      }, [time, matched]);

      const handleFlip = (card) => {
        if (flipped.length >= 2 || flipped.includes(card.id) || matched.includes(card.emoji)) return;
        const nextFlipped = [...flipped, card.id];
        setFlipped(nextFlipped);
        if (nextFlipped.length === 2) {
          const card1 = cards.find(x => x.id === nextFlipped[0]);
          const card2 = cards.find(x => x.id === nextFlipped[1]);
          if (card1.emoji === card2.emoji) {
            setMatched([...matched, card1.emoji]);
            setScore(s => s + 20);
            setFlipped([]);
          } else {
            setTimeout(() => setFlipped([]), 800);
          }
        }
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-sm mx-auto">
          <div className="flex justify-between w-full mb-3 text-xs font-mono text-gray-400">
            <span>TIMER: <span className="text-rose-500 font-bold">{time}s</span></span>
            <span>SCORE: <span className="text-emerald-400 font-bold">{score}</span></span>
          </div>
          <div className="grid grid-cols-4 gap-2.5 p-3 bg-slate-900/80 rounded-2xl border border-white/10 w-full">
            {cards.map((card, idx) => {
              const isOpen = flipped.includes(card.id) || matched.includes(card.emoji);
              return (
                <button key={idx} onClick={() => handleFlip(card)} className={`w-full aspect-square flex items-center justify-center rounded-xl text-2xl font-bold transition-all duration-300 ${isOpen ? 'bg-gradient-to-br from-teal-500 to-emerald-600 text-white scale-100 rotate-0' : 'bg-slate-800 hover:bg-slate-700 text-transparent rotate-180'}`}>
                  {isOpen ? card.emoji : '❓'}
                </button>
              );
            })}
          </div>
          <div className="flex gap-2 mt-4 w-full justify-center">
            <button onClick={initCards} className="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl">RESTART</button>
            <button onClick={onExit} className="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white text-xs font-bold rounded-xl">EXIT</button>
          </div>
        </div>
      );
    }

    // Component 6: Simon Neon Glow (Pattern recognition challenge)
    function SimonSays({ onGameOver, onExit }) {
      const colors = ['emerald', 'rose', 'sky', 'amber'];
      const bgColors = { emerald: 'bg-emerald-500', rose: 'bg-rose-500', sky: 'bg-sky-500', amber: 'bg-amber-500' };
      const glowColors = { emerald: 'shadow-emerald-500/50', rose: 'shadow-rose-500/50', sky: 'shadow-sky-500/50', amber: 'shadow-amber-500/50' };
      const [sequence, setSequence] = useState([]);
      const [userSequence, setUserSequence] = useState([]);
      const [activeColor, setActiveColor] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [score, setScore] = useState(0);

      const triggerSequence = (seq) => {
        setIsPlaying(true);
        let i = 0;
        const play = setInterval(() => {
          setActiveColor(seq[i]);
          setTimeout(() => setActiveColor(null), 400);
          i++;
          if (i >= seq.length) {
            clearInterval(play);
            setIsPlaying(false);
          }
        }, 800);
      };

      const startNewGame = () => {
        const first = colors[Math.floor(Math.random() * colors.length)];
        setSequence([first]);
        setUserSequence([]);
        setScore(0);
        triggerSequence([first]);
      };

      const handlePress = (color) => {
        if (isPlaying || sequence.length === 0) return;
        setActiveColor(color);
        setTimeout(() => setActiveColor(null), 200);
        const nextUserSeq = [...userSequence, color];
        setUserSequence(nextUserSeq);
        const currentIdx = nextUserSeq.length - 1;
        if (nextUserSeq[currentIdx] !== sequence[currentIdx]) {
          onGameOver(score, Math.floor(score * 0.5));
          setSequence([]);
          return;
        }
        if (nextUserSeq.length === sequence.length) {
          setScore(s => s + 15);
          setUserSequence([]);
          const nextSeq = [...sequence, colors[Math.floor(Math.random() * colors.length)]];
          setSequence(nextSeq);
          setTimeout(() => triggerSequence(nextSeq), 1000);
        }
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-sm mx-auto">
          <div className="flex justify-between w-full mb-3 text-xs font-mono text-gray-400">
            <span>SEQUENCE SPEED: <span className="text-purple-400 font-bold">{sequence.length} STEPS</span></span>
            <span>SCORE: <span className="text-yellow-400 font-bold">{score}</span></span>
          </div>
          <div className="grid grid-cols-2 gap-3 p-4 bg-slate-900 rounded-2xl border border-white/10 w-full aspect-square">
            {colors.map((color, idx) => (
              <button key={idx} onClick={() => handlePress(color)} className={`w-full aspect-square rounded-2xl transition-all duration-200 border border-white/5 active:scale-95 ${activeColor === color ? `${bgColors[color]} shadow-lg ${glowColors[color]} scale-102` : `bg-slate-800 hover:bg-slate-750 opacity-60`}`} />
            ))}
          </div>
          <div className="flex gap-2 mt-4 w-full justify-center">
            <button onClick={startNewGame} className="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded-xl shadow-lg shadow-purple-600/20 active:scale-95">PLAY</button>
            <button onClick={onExit} className="px-5 py-2.5 bg-white/5 hover:bg-white/10 text-white text-xs font-bold rounded-xl">EXIT</button>
          </div>
        </div>
      );
    }

    // Component 7: 2048 Neon Grid (Compact 3x3 slide-match)
    function Game2048({ onGameOver, onExit }) {
      const [board, setBoard] = useState([[2, 0, 0], [0, 2, 0], [0, 0, 0]]);
      const [score, setScore] = useState(0);

      const spawn = (currBoard) => {
        let empty = [];
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            if (currBoard[r][c] === 0) empty.push({ r, c });
          }
        }
        if (empty.length === 0) return currBoard;
        let choice = empty[Math.floor(Math.random() * empty.length)];
        currBoard[choice.r][choice.c] = Math.random() > 0.8 ? 4 : 2;
        return currBoard;
      };

      const slide = (row) => {
        let filtered = row.filter(val => val !== 0);
        let missing = 3 - filtered.length;
        let zeros = Array(missing).fill(0);
        return [...filtered, ...zeros];
      };

      const merge = (row) => {
        let nextRow = [...row];
        for (let i = 0; i < 2; i++) {
          if (nextRow[i] !== 0 && nextRow[i] === nextRow[i + 1]) {
            nextRow[i] *= 2;
            setScore(s => s + nextRow[i]);
            nextRow[i + 1] = 0;
          }
        }
        return nextRow;
      };

      const handleMove = (dir) => {
        let nextBoard = board.map(row => [...row]);
        if (dir === 'left') {
          nextBoard = nextBoard.map(row => slide(merge(slide(row))));
        } else if (dir === 'right') {
          nextBoard = nextBoard.map(row => slide(merge(slide(row.reverse()))).reverse());
        }
        nextBoard = spawn(nextBoard);
        setBoard(nextBoard);
        let hasMoves = false;
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            if (nextBoard[r][c] === 0) hasMoves = true;
          }
        }
        if (!hasMoves) {
          onGameOver(score, Math.floor(score * 0.4));
        }
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-sm mx-auto">
          <div className="flex justify-between w-full mb-3 text-xs font-mono text-gray-400">
            <span>GRID: <span className="text-amber-400 font-bold">3x3 SPEED</span></span>
            <span>SCORE: <span className="text-emerald-400 font-bold">{score}</span></span>
          </div>
          <div className="grid grid-cols-3 gap-2.5 p-3.5 bg-slate-900 rounded-2xl border border-white/10 w-full aspect-square mb-4">
            {board.flatMap((row, r) => row.map((val, c) => (
              <div key={`${r}-${c}`} className={`w-full aspect-square flex items-center justify-center rounded-xl text-xl font-black shadow-lg transition-all border border-white/5 ${val === 2 ? 'bg-amber-100 text-slate-900' : val === 4 ? 'bg-amber-300 text-slate-900' : val === 8 ? 'bg-orange-400 text-white' : val === 16 ? 'bg-orange-600 text-white shadow-orange-500/20' : val >= 32 ? 'bg-rose-500 text-white shadow-rose-500/40' : 'bg-slate-800/50 text-transparent'}`}>
                {val || ''}
              </div>
            )))}
          </div>
          <div className="grid grid-cols-3 gap-2 w-full max-w-[200px]">
            <div />
            <button onClick={() => handleMove('left')} className="p-3 bg-slate-800 hover:bg-slate-700 active:scale-90 rounded-xl font-bold text-sky-400">◀</button>
            <button onClick={() => handleMove('right')} className="p-3 bg-slate-800 hover:bg-slate-700 active:scale-90 rounded-xl font-bold text-sky-400">▶</button>
          </div>
        </div>
      );
    }

    // Component 8: Flappy Neon Bird (Dodge lasers)
    function FlappyNeon({ onGameOver, onExit }) {
      const [score, setScore] = useState(0);
      const [posY, setPosY] = useState(150);
      const [vel, setVel] = useState(0);
      const [pipeX, setPipeX] = useState(300);

      useEffect(() => {

        const gravity = setInterval(() => {
          setPosY(y => {
            let next = y + vel;
            if (next < 0 || next > 280) {
              setGameState('gameover');
              onGameOver(score, score * 2);
              clearInterval(gravity);
              return 150;
            }
            return next;
          });
          setVel(v => v + 0.6);
        }, 30);
        return () => clearInterval(gravity);
      }, [gameState, vel]);

      useEffect(() => {
        if (gameState !== 'playing') return;
        const pipeMover = setInterval(() => {
          setPipeX(x => {
            if (x < -40) {
              setScore(s => s + 10);
              let newTop = 50 + Math.random() * 120;
              setPipeGap({ top: newTop, bottom: newTop + 100 });

                onGameOver(score, score * 2);
                clearInterval(pipeMover);

            return x - 4;
          });

            <div className="absolute w-10 bg-rose-600/40 border-l border-r border-rose-500 shadow-lg shadow-rose-500/20" style={{ left: pipeX, top: pipeGap.bottom, bottom: 0 }} />

                <p className="text-xs text-gray-400 text-center mb-6 max-w-[200px]">Tap or spacebar to fly. Navigate through laser gate pillars!</p>
                <div className="flex gap-2">
                  <button onClick={(e) => { e.stopPropagation(); setPosY(150); setVel(0); setPipeX(300); setScore(0); setGameState('playing'); }} className="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold rounded-xl">PLAY</button>
                  <button onClick={(e) => { e.stopPropagation(); onExit(); }} className="px-5 py-2.5 bg-white/5 text-white text-xs font-bold rounded-xl">EXIT</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );

    // Component 9: Brick Breaker Glow (Retro ball bouncing)
    function BrickBreaker({ onGameOver, onExit }) {
      const [score, setScore] = useState(0);
      const [gameState, setGameState] = useState('idle');
      const [ball, setBall] = useState({ x: 150, y: 220, dx: 3, dy: -3 });
      const [paddle, setPaddle] = useState(110);
      const [bricks, setBricks] = useState([]);

      const initBricks = () => {
        let items = [];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 6; c++) {
            items.push({ id: r*6+c, x: c*48 + 8, y: r*16 + 24, alive: true });
          }
        }
        setBricks(items);
        setBall({ x: 150, y: 220, dx: 3, dy: -3 });
        setPaddle(110);
        setScore(0);
      };

      useEffect(() => {
        if (gameState !== 'playing') return;
        const gameLoop = setInterval(() => {
          setBall(b => {
            let nextX = b.x + b.dx;
            let nextY = b.y + b.dy;
            let nextDx = b.dx;
            let nextDy = b.dy;

            // Border Bounce
            if (nextX < 4 || nextX > 296) nextDx = -nextDx;
            if (nextY < 4) nextDy = -nextDy;

            // Paddle bounce
            if (nextY >= 265 && nextX >= paddle && nextX <= paddle + 80) {
              nextDy = -Math.abs(nextDy);
              nextDx = ((nextX - (paddle + 40)) / 10); // angle
            }

            // Lose condition
            if (nextY > 290) {
              setGameState('gameover');
              onGameOver(score, Math.floor(score * 0.5));
              clearInterval(gameLoop);
            }

            // Brick collision
            setBricks(prevBricks => {
              let nextBricks = [...prevBricks];
              nextBricks.forEach(brick => {
                if (brick.alive && nextX >= brick.x && nextX <= brick.x + 44 && nextY >= brick.y && nextY <= brick.y + 12) {
                  brick.alive = false;
                  nextDy = -nextDy;
                  setScore(s => s + 20);
                }
              });
              return nextBricks;
            });

            return { x: nextX, y: nextY, dx: nextDx, dy: nextDy };
          });
        }, 25);
        return () => clearInterval(gameLoop);
      }, [gameState, paddle, bricks]);

      const handleTouchMove = (e) => {
        const bounds = e.currentTarget.getBoundingClientRect();
        const touchX = e.touches[0].clientX - bounds.left;
        setPaddle(Math.max(0, Math.min(touchX - 40, 220)));
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-sm mx-auto">
          <div className="flex justify-between w-full mb-3 text-xs font-mono text-gray-400">
            <span>BRICKS REMAINING: <span className="text-purple-400 font-bold">{bricks.filter(b=>b.alive).length}</span></span>
            <span>SCORE: <span className="text-yellow-400 font-bold">{score}</span></span>
          </div>
          <div onTouchMove={handleTouchMove} className="relative aspect-square w-full rounded-2xl overflow-hidden border border-white/10 shadow-lg bg-[#0e0b16] select-none">
            {bricks.map(b => b.alive && (
              <div key={b.id} className="absolute h-3.5 rounded bg-violet-600/80 border border-violet-400 shadow-lg shadow-violet-500/20" style={{ left: b.x, top: b.y, width: 44 }} />
            ))}
            <div className="absolute w-3 h-3 bg-fuchsia-400 rounded-full shadow-lg shadow-fuchsia-500/50" style={{ left: ball.x - 6, top: ball.y - 6 }} />
            <div className="absolute h-3.5 bg-gradient-to-r from-pink-500 to-violet-500 rounded-full shadow-lg shadow-pink-500/30" style={{ left: paddle, bottom: 15, width: 80 }} />
            {gameState !== 'playing' && (
              <div className="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-4">
                <h3 className="text-lg font-black text-white font-display mb-2 uppercase">Brick Breaker</h3>
                <p className="text-xs text-gray-400 text-center mb-6 max-w-[200px]">Slide to move your paddle. Shatter all glowing purple brick arrays!</p>
                <div className="flex gap-2">
                  <button onClick={() => { initBricks(); setGameState('playing'); }} className="px-5 py-2.5 bg-violet-600 hover:bg-violet-700 text-white text-xs font-bold rounded-xl">PLAY</button>
                  <button onClick={onExit} className="px-5 py-2.5 bg-white/5 text-white text-xs font-bold rounded-xl">EXIT</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Component 10: Neon Retro Pong
    function NeonPong({ onGameOver, onExit }) {
      const [score, setScore] = useState(0);
      const [botScore, setBotScore] = useState(0);
      const [ball, setBall] = useState({ x: 150, y: 150, dx: 3, dy: 3 });

      const [bot, setBot] = useState(110);

      useEffect(() => {
        if (gameState !== 'playing') return;
        const pongLoop = setInterval(() => {
          setBall(b => {
            let nx = b.x + b.dx;
            let ny = b.y + b.dy;
            let ndx = b.dx;
            let ndy = b.dy;

            // Border Bounce (sides)
            if (nx < 4 || nx > 296) ndx = -ndx;

            // Goal detection
            if (ny < 0) {
              setScore(s => s + 1);
              ndy = -ndy;
              return { x: 150, y: 150, dx: 3, dy: 3 };

            if (ny > 300) {
              setBotScore(s => s + 1);
              ndy = -ndy;
              return { x: 150, y: 150, dx: -3, dy: -3 };

            // Paddle hits
            if (ny >= 280 && nx >= player && nx <= player + 80) {

              ndy = Math.abs(ndy);

            return { x: nx, y: ny, dx: ndx, dy: ndy };

          // Bot tracking ball with a bit of error margin
          setBot(b => {
            let center = b + 40;
            if (ball.x > center + 10) return Math.min(220, b + 4);
            if (ball.x < center - 10) return Math.max(0, b - 4);
            return b;
          });
        }, 20);

        if (score >= 5 || botScore >= 5) {
          setGameState('gameover');
          onGameOver(score * 20, Math.floor(score * 10));
          clearInterval(pongLoop);
        }

        return () => clearInterval(pongLoop);
      }, [gameState, ball, player, bot, score, botScore]);

      const handleTouchMove = (e) => {
        const bounds = e.currentTarget.getBoundingClientRect();
        const touchX = e.touches[0].clientX - bounds.left;
        setPlayer(Math.max(0, Math.min(touchX - 40, 220)));

            <span>PLAYER: <span className="text-emerald-400 font-bold">{score}</span></span>

            <div className="absolute top-0 inset-x-0 h-0.5 bg-white/5 border-dashed" />

            <div className="absolute w-3.5 h-3.5 bg-lime-400 rounded-full shadow-lg shadow-lime-500/50" style={{ left: ball.x - 7, top: ball.y - 7 }} />
            <div className="absolute h-3.5 bg-emerald-500 rounded-full w-20" style={{ left: player, bottom: 10 }} />
            {gameState !== 'playing' && (
              <div className="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-4">
                <h3 className="text-lg font-black text-white font-display mb-2 uppercase">Retro Pong</h3>
                <p className="text-xs text-gray-400 text-center mb-6 max-w-[200px]">Slide bottom paddle. Be the first to score 5 cyber-goals!</p>
                <div className="flex gap-2">
                  <button onClick={() => { setScore(0); setBotScore(0); setGameState('playing'); }} className="px-5 py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl">PLAY</button>
                  <button onClick={onExit} className="px-5 py-2.5 bg-white/5 text-white text-xs font-bold rounded-xl">EXIT</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Component 11: Color Flood Splash (Step based flood game)
    function ColorFlood({ onGameOver, onExit }) {
      const colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#ec4899'];
      const [grid, setGrid] = useState([]);
      const [steps, setSteps] = useState(0);
      const [maxSteps] = useState(15);
      const [won, setWon] = useState(false);

      const initGrid = () => {
        let cells = [];
        for (let i = 0; i < 36; i++) {
          cells.push(colors[Math.floor(Math.random() * colors.length)]);
        }
        setGrid(cells);
        setSteps(0);
        setWon(false);
      };

      useEffect(() => { initGrid(); }, []);

      const flood = (targetColor) => {
        if (won || steps >= maxSteps) return;
        const nextGrid = [...grid];
        const oldColor = nextGrid[0];
        if (oldColor === targetColor) return;

        let queue = [0];
        let visited = new Set();
        visited.add(0);

        while (queue.length > 0) {
          let curr = queue.shift();
          nextGrid[curr] = targetColor;

          // Neighbors (right, left, down, up)
          let neighbors = [];
          if (curr % 6 < 5) neighbors.push(curr + 1);
          if (curr % 6 > 0) neighbors.push(curr - 1);
          if (curr < 30) neighbors.push(curr + 6);
          if (curr >= 6) neighbors.push(curr - 6);

          neighbors.forEach(n => {
            if (!visited.has(n) && grid[n] === oldColor) {
              visited.add(n);
              queue.push(n);
            }
          });
        }

        setGrid(nextGrid);
        setSteps(s => s + 1);

        const winCheck = nextGrid.filter(c => c === targetColor).length === 36;
        if (winCheck) {
          setWon(true);
          onGameOver(150, 75);
        } else if (steps + 1 >= maxSteps) {
          onGameOver(30, 15);
        }
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-sm mx-auto">
          <div className="flex justify-between w-full mb-3 text-xs font-mono text-gray-400">
            <span>STEPS: <span className="text-pink-400 font-bold">{steps}/{maxSteps}</span></span>
            <span>STATUS: <span className="text-emerald-400 font-bold">{won ? 'WON' : 'ACTIVE'}</span></span>
          </div>
          <div className="grid grid-cols-6 gap-1 p-2 bg-slate-900 rounded-2xl border border-white/10 w-full aspect-square">
            {grid.map((color, idx) => (
              <div key={idx} className="w-full aspect-square rounded" style={{ backgroundColor: color }} />
            ))}
          </div>
          <div className="flex justify-center gap-2 mt-4 w-full">
            {colors.map((color, idx) => (
              <button key={idx} onClick={() => flood(color)} className="w-8 h-8 rounded-full border border-white/20 active:scale-90" style={{ backgroundColor: color }} />
            ))}
          </div>
        </div>
      );
    }

    // Component 12: Grid Runner (Avoid firewalls)
    function GridRunner({ onGameOver, onExit }) {
      const [player, setPlayer] = useState({ r: 2, c: 2 });
      const [energy, setEnergy] = useState({ r: 1, c: 1 });
      const [firewall, setFirewall] = useState({ r: 0, c: 4 });

      const spawnLocation = () => {
        return { r: Math.floor(Math.random() * 5), c: Math.floor(Math.random() * 5) };
      };

      const handleMove = (dr, dc) => {
        let nr = Math.max(0, Math.min(4, player.r + dr));
        let nc = Math.max(0, Math.min(4, player.c + dc));
        setPlayer({ r: nr, c: nc });

        // Energy collect
        if (nr === energy.r && nc === energy.c) {
          setScore(s => s + 15);
          setEnergy(spawnLocation());
          // Firewall chases
          setFirewall(f => {
            let fdr = nr > f.r ? 1 : nr < f.r ? -1 : 0;
            let fdc = nc > f.c ? 1 : nc < f.c ? -1 : 0;
            return { r: f.r + fdr, c: f.c + fdc };
          });
        }

        // Firewall check
        if (nr === firewall.r && nc === firewall.c) {
          onGameOver(score, Math.floor(score * 0.5));
          setScore(0);
          setPlayer({ r: 2, c: 2 });
          setFirewall({ r: 0, c: 4 });
        }
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-sm mx-auto">
          <div className="flex justify-between w-full mb-3 text-xs font-mono text-gray-400">
            <span>GRID: <span className="text-orange-400 font-bold">Runner v1</span></span>
            <span>SCORE: <span className="text-yellow-400 font-bold">{score}</span></span>
          </div>
          <div className="grid grid-cols-5 gap-2 p-3 bg-slate-900 rounded-2xl border border-white/10 w-full aspect-square mb-4">
            {Array(25).fill(0).map((_, idx) => {
              const r = Math.floor(idx / 5);
              const c = idx % 5;
              const isPlayer = player.r === r && player.c === c;
              const isEnergy = energy.r === r && energy.c === c;
              const isFirewall = firewall.r === r && firewall.c === c;

              return (
                <div key={idx} className={`w-full aspect-square rounded-xl flex items-center justify-center text-lg ${isPlayer ? 'bg-sky-500 shadow-lg shadow-sky-500/50' : isEnergy ? 'bg-amber-400 shadow-lg animate-pulse' : isFirewall ? 'bg-red-500 shadow-lg animate-bounce' : 'bg-slate-800/30'}`}>
                  {isPlayer ? '⚡' : isEnergy ? '🔋' : isFirewall ? '👾' : ''}
                </div>
              );

      const sectors = ['10 PTS', '30 PTS', '50 PTS', 'JACKPOT', '20 PTS', '70 PTS', '100 PTS', 'TRY AGAIN'];

    // Component 16: Math Rush Challenge
    function MathRush({ onGameOver, onExit }) {
      const [problem, setProblem] = useState({ q: '', ans: 0 });
      const [score, setScore] = useState(0);
      const [time, setTime] = useState(15);

      const generateProblem = () => {
        const a = Math.floor(Math.random() * 12) + 1;
        const b = Math.floor(Math.random() * 12) + 1;
        const op = Math.random() > 0.5 ? '+' : '-';
        const q = `${a} ${op} ${b}`;
        const ans = op === '+' ? a + b : a - b;
        setProblem({ q, ans });
      };

      useEffect(() => {
        generateProblem();
      }, []);

      useEffect(() => {
        if (time <= 0) {
          onGameOver(score, Math.floor(score * 0.5));
          return;
        }
        const timer = setTimeout(() => setTime(t => t - 1), 1000);
        return () => clearTimeout(timer);
      }, [time]);

      const checkAnswer = (correct) => {
        const fakeVal = Math.random() > 0.5 ? problem.ans : problem.ans + 2;
        const isTrue = fakeVal === problem.ans;
        if (correct === isTrue) {
          setScore(s => s + 10);
          setTime(t => Math.min(15, t + 3));
          generateProblem();
        } else {
          onGameOver(score, Math.floor(score * 0.5));
        }
      };

      return (
        <div className="flex flex-col items-center justify-center p-4 w-full max-w-sm mx-auto">
          <div className="text-xs font-mono text-gray-400 mb-4">TIMER: <span className="text-rose-500 font-bold">{time}s</span></div>
          <div className="text-3xl font-black mb-8 text-sky-400">{problem.q} = {problem.ans} ?</div>
          <div className="flex gap-4 w-full max-w-[200px]">
            <button onClick={() => checkAnswer(true)} className="flex-1 py-3 bg-emerald-500 text-slate-950 font-bold rounded-xl active:scale-95">TRUE</button>
            <button onClick={() => checkAnswer(false)} className="flex-1 py-3 bg-rose-500 text-slate-950 font-bold rounded-xl active:scale-95">FALSE</button>
          </div>
        </div>
      );
    }

    // Component: Game Container (Renders active mini-game with game over statistics upgrades)
    function GameContainer({ game, userStats, onExitGame, onUpdateStats, isSoundOn }) {
      const [statGain, setStatGain] = useState(null);

      const handleGameOver = (score, coinsEarned) => {
        const baseXP = 15;
        const scoreBonus = Math.min(score, 50);
        const xpGained = baseXP + scoreBonus;

        const previousHighScore = userStats.highScores[game.highScoreKey] || 0;
        const isNewRecord = score > previousHighScore;
        const nextHighScore = isNewRecord ? score : previousHighScore;

        let nextXp = userStats.xp + xpGained;
        let nextLevel = userStats.level;
        const calculatedLevel = Math.floor(nextXp / 100) + 1;
        if (calculatedLevel > nextLevel) {
          nextLevel = calculatedLevel;
        }

        const nextCoins = userStats.coins + coinsEarned;
        const now = new Date();
        const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const newHistoryEntry = {
          gameId: game.id,
          gameName: game.name,
          score: score,
          coins: coinsEarned,
          date: dateStr
        };

        const updatedHistory = [newHistoryEntry, ...(userStats.history || [])].slice(0, 20);

        const nextStats = {
          ...userStats,
          level: nextLevel,
          xp: nextXp,
          coins: nextCoins,
          gamesPlayedCount: userStats.gamesPlayedCount + 1,
          highScores: {
            ...userStats.highScores,
            [game.highScoreKey]: nextHighScore,
          },
          history: updatedHistory
        };

        onUpdateStats(nextStats);

        setStatGain({
          xp: xpGained,
          coins: coinsEarned,
          isNewRecord
        });

        // Trigger GigaPub Ad on Game Session End
        if (typeof window.triggerGigaAd === 'function') {
          window.triggerGigaAd();
        }
      };

      const renderGame = () => {
        switch (game.id) {
          case 'snake_game':
            return <SnakeGame onGameOver={handleGameOver} onExit={onExitGame} isSoundOn={isSoundOn} />;
          case 'knife_hit':
            return <KnifeHit onGameOver={handleGameOver} onExit={onExitGame} isSoundOn={isSoundOn} />;
          case 'tower_stack':
            return <TowerStack onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'tic_tac_toe':
            return <TicTacToe onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'minesweeper':
            return <Minesweeper onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'memory_match':
            return <MemoryMatch onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'simon_says':
            return <SimonSays onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'game_2048':
            return <Game2048 onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'flappy_neon':
            return <FlappyNeon onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'brick_breaker':
            return <BrickBreaker onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'neon_pong':
            return <NeonPong onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'color_flood':
            return <ColorFlood onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'grid_runner':
            return <GridRunner onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'lucky_wheel':
            return <LuckyWheel onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'dice_roll':
            return <DiceRoll onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'rock_paper_scissors':
            return <RockPaperScissors onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'math_rush':
            return <MathRush onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'word_scramble':
            return <WordScramble onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'click_speed':
            return <ClickSpeed onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'fruit_slicer':
            return <FruitSlicer onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'coin_grabber':
            return <CoinGrabber onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'asteroid_dodge':
            return <AsteroidDodge onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'helix_fall':
            return <HelixFall onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'plinko':
            return <Plinko onGameOver={handleGameOver} onExit={onExitGame} />;
          case 'space_shooter':
            return <SpaceShooter onGameOver={handleGameOver} onExit={onExitGame} />;
          default:
            return <SnakeGame onGameOver={handleGameOver} onExit={onExitGame} isSoundOn={isSoundOn} />;
        }
      };

      return (
        <div className="flex-1 flex flex-col h-full bg-[#07060c] animate-fade-in relative">
          {/* Header */}
          <div className="h-14 px-4 flex items-center justify-between border-b border-white/5 bg-black/40 backdrop-blur-md relative z-20">
            <button onClick={onExitGame} className="flex items-center gap-1.5 text-xs text-gray-400 hover:text-white cursor-pointer transition-colors">
              <Icon name="arrow-left" className="w-4 h-4" /> Exit
            </button>
            <div className="flex items-center gap-2">
              <span className="text-xs font-black tracking-tight text-white font-display uppercase">{game.name}</span>
            </div>
            <div className="w-10"></div>
          </div>

          {/* Canvas Viewport */}
          <div className="flex-1 flex items-center justify-center overflow-y-auto">
            {renderGame()}
          </div>

          {/* Stats Rewards Splash popup */}
          {statGain && (
            <div className="absolute inset-0 bg-[#040306]/95 z-50 flex flex-col justify-center items-center p-6 text-center animate-fade-in">
              <div className="w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-3xl mb-4 shadow-lg animate-bounce">
                🎉
              </div>
              <h3 className="text-2xl font-black font-display text-white mb-1">SESSION COMPLETE</h3>
              <p className="text-xs text-gray-500 mb-6">You earned exciting coins and progression XP!</p>

              <div className="grid grid-cols-2 gap-4 w-full max-w-[280px] mb-8">
                <div className="bg-white/[0.02] border border-white/5 rounded-2xl p-4 flex flex-col items-center">
                  <span className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest font-mono">XP GAINED</span>
                  <span className="text-xl font-black text-white mt-1">+{statGain.xp} XP</span>
                </div>
                <div className="bg-white/[0.02] border border-white/5 rounded-2xl p-4 flex flex-col items-center">
                  <span className="text-[10px] font-bold text-amber-400 uppercase tracking-widest font-mono">COINS EARNED</span>
                  <span className="text-xl font-black text-amber-400 mt-1">+{statGain.coins} 🪙</span>
                </div>
              </div>

              {statGain.isNewRecord && (
                <div className="mb-6 bg-yellow-500/15 border border-yellow-500/20 text-yellow-400 font-sans font-black text-[10px] tracking-widest uppercase px-4 py-1.5 rounded-full animate-pulse">
                  🏆 NEW PERSONAL RECORD!
                </div>
              )}

              <button
                onClick={() => {
                  setStatGain(null);
                  onExitGame();
                }}
                className="w-full max-w-[200px] py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-sans text-xs font-black rounded-xl shadow-lg active:scale-95 transition-all cursor-pointer"
              >
                CONTINUE
              </button>
            </div>
          )}
        </div>
      );
    }

                <button
                  onClick={() => setActiveTab('arcade')}
                  className={`flex flex-col items-center justify-center flex-1 h-full py-1 transition-all cursor-pointer ${
                    activeTab === 'arcade' ? 'text-indigo-400 scale-105 font-bold' : 'text-gray-500 hover:text-gray-300'
                  }`}
                >
                  <Icon name="gamepad-2" className="w-5 h-5 mb-0.5" />
                  <span className="text-[9px] font-sans tracking-wide">Arcade</span>
                </button>

                <button
                  onClick={() => setActiveTab('referrals')}
                  className={`flex flex-col items-center justify-center flex-1 h-full py-1 transition-all cursor-pointer ${
                    activeTab === 'referrals' ? 'text-indigo-400 scale-105 font-bold' : 'text-gray-500 hover:text-gray-300'
                  }`}
                >
                  <Icon name="users" className="w-5 h-5 mb-0.5" />
                  <span className="text-[9px] font-sans tracking-wide">Referrals</span>
                </button>

                <button
                  onClick={() => setActiveTab('wallet')}
                  className={`flex flex-col items-center justify-center flex-1 h-full py-1 transition-all cursor-pointer ${
                    activeTab === 'wallet' ? 'text-indigo-400 scale-105 font-bold' : 'text-gray-500 hover:text-gray-300'
                  }`}
                >
                  <Icon name="wallet" className="w-5 h-5 mb-0.5" />
                  <span className="text-[9px] font-sans tracking-wide">Wallet</span>
                </button>

                <button
                  onClick={() => setActiveTab('profile')}
                  className={`flex flex-col items-center justify-center flex-1 h-full py-1 transition-all cursor-pointer ${
                    activeTab === 'profile' ? 'text-indigo-400 scale-105 font-bold' : 'text-gray-500 hover:text-gray-300'
                  }`}
                >
                  <Icon name="user" className="w-5 h-5 mb-0.5" />
                  <span className="text-[9px] font-sans tracking-wide">Profile</span>
                </button>
              </div>
            )}

            {/* Ad Modal */}
            {isAdOpen && (
              <div className="absolute inset-0 bg-[#020104]/98 z-[9999] flex flex-col justify-between p-6 animate-fade-in font-sans">
                <div className="flex justify-between items-center border-b border-white/5 pb-4">
                  <span className="text-[10px] font-mono tracking-widest text-indigo-400 font-bold uppercase">
                    Rich Camel Ad Network
                  </span>
                  <span className="text-[10px] font-bold text-yellow-500 bg-yellow-500/10 border border-yellow-500/20 px-2.5 py-1 rounded-full">
                    Sponsor Promotion
                  </span>
                </div>

                <div className="flex-1 flex flex-col items-center justify-center text-center my-6 gap-6">
                  <div className="w-24 h-24 rounded-3xl bg-gradient-to-tr from-amber-500 via-orange-500 to-yellow-400 p-[2px] shadow-[0_0_30px_rgba(245,158,11,0.2)] animate-pulse">
                    <div className="w-full h-full bg-[#050508] rounded-3xl flex items-center justify-center text-5xl">
                      🐪
                    </div>
                  </div>

                  <div className="space-y-2">
                    <h3 className="text-lg font-black tracking-tight text-white font-display">
                      RICH CAMEL AIRDROP PRE-SALE
                    </h3>
                    <p className="text-xs text-gray-400 max-w-[280px] leading-relaxed mx-auto">
                      Join the massive <strong className="text-amber-400">$CAMEL</strong> Token Pre-sale today! Keep playing games, referring active friends, and stacking your balances.
                    </p>
                  </div>
                </div>

                <div className="flex flex-col gap-3 border-t border-white/5 pt-5">
                  <div className="flex items-center justify-between text-[11px] font-bold text-gray-400 font-mono">
                    <span>Time Remaining</span>
                    <span className="text-yellow-400 font-black">{adCountdown > 0 ? `${adCountdown}s` : 'Reward Ready'}</span>
                  </div>

                  <div className="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                    <div 
                      className="h-full bg-gradient-to-r from-amber-500 to-yellow-400 transition-all duration-300"
                      style={{ width: `${((5 - adCountdown) / 5) * 100}%` }}
                    />
                  </div>

                  <button
                    onClick={handleCloseAd}
                    disabled={adCountdown > 0}
                    className={`w-full py-3 rounded-xl font-sans text-xs font-black tracking-wider transition-all shadow-lg ${
                      adCountdown <= 0
                        ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 hover:scale-[1.01] cursor-pointer active:scale-[95]'
                        : 'bg-white/5 text-gray-600 border border-white/5 cursor-not-allowed'
                    }`}
                  >
                    {adCountdown > 0 ? `CLOSE AD IN ${adCountdown}S` : 'CLOSE AD & CLAIM REWARD'}
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

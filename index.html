<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Camel 🐫 - Update in Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: radial-gradient(circle at top, #2d1b0d, #000000); 
            color: white; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0;
        }

        .gold-text { 
            background: linear-gradient(to bottom, #FFD700, #B8860B); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 30px; 
            padding: 40px 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .camel-animation {
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .loader-dots span {
            width: 10px;
            height: 10px;
            margin: 0 5px;
            background: #FFD700;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loader-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .update-btn {
            background: linear-gradient(180deg, #FFD700, #B8860B);
            color: black;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 15px;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2);
        }

        .update-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 215, 0, 0.3);
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #222;
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 75%; /* আপনি চাইলে এটি পরিবর্তন করতে পারেন */
            background: #FFD700;
            box-shadow: 0 0 10px #FFD700;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="camel-animation">🐫</div>
        
        <h1 class="text-3xl font-extrabold gold-text uppercase tracking-widest mb-2">New Update</h1>
        <p class="text-gray-400 text-sm mb-6">We are currently improving your desert experience. Something big is coming!</p>
        
        <div class="loader-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <p class="text-[10px] text-yellow-500 mt-2 font-bold uppercase tracking-widest">Update in Progress: 75%</p>

        <a href="https://t.me/RichCamel0" class="update-btn uppercase text-xs">
            <i class="fab fa-telegram-plane mr-2"></i> Join Telegram for News
        </a>

        <p class="text-[9px] text-gray-600 mt-10 uppercase tracking-tighter">Rich Camel 🐫 - Empowering the Desert Economy</p>
    </div>

</body>
</html>
